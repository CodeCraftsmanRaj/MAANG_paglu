<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ContextForge Capture settings</title>
  <style>
    body { max-width: 560px; margin: 40px auto; padding: 0 20px; font: 14px system-ui, sans-serif; color: #1c1c1a; }
    label { display: block; margin: 18px 0 6px; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; padding: 9px; border: 1px solid #aaa; }
    button { margin-top: 18px; padding: 9px 14px; cursor: pointer; }
    #status { margin-left: 10px; color: #2b5d4f; }
  </style>
</head>
<body>
  <h1>ContextForge Capture</h1>
  <p>Configure the local backend connection used by the browser extension.</p>
  <label for="token">Bearer token</label>
  <input id="token" type="password" autocomplete="off" placeholder="Copy from ContextForge &gt; Capture">
  <label for="projectId">Project ID</label>
  <input id="projectId" autocomplete="off" value="proj_default">
  <button id="save">Save settings</button><span id="status" role="status"></span>
  <script src="options.js"></script>
</body>
</html>
