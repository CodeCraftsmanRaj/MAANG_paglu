[project]
name = "contextforge"
version = "0.1.0"
description = "ContextForge: An enterprise knowledge plane with cryptographic provenance, tag-based RBAC, and 8 dynamic retrieval paradigms."
readme = "BACKEND_ARCHITECTURE.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "boto3>=1.34.0",
    "fastapi>=0.110.0",
    "fastembed>=0.3.0",
    "httpx>=0.27.0",
    "mangum>=0.22.0",
    "networkx>=3.2",
    "numpy>=1.26.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
